  <text class="t kb" x="266" y="708">字符串全走 String Catalog，禁止硬编码，多语言集中翻译不散落</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">无障碍四层：语义/标签/值/特征，读屏软件靠这些理解界面</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">CI 跑伪本地化，提前发现硬编码和长文本布局溢出</text>
