  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="146" r="14" fill="#F05138"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 硬编码 + 无 a11y</text>
  <rect x="64" y="176" width="270" height="150" rx="12" fill="#1e293b" stroke="#e5484d" stroke-width="2.5"/>
  <circle cx="84" cy="194" r="5.5" fill="#ff6b6b"/>
  <circle cx="102" cy="194" r="5.5" fill="#ffd166"/>
  <circle cx="120" cy="194" r="5.5" fill="#4cd97b"/>
  <text class="m" x="84" y="222" font-size="11.5" fill="#e2e8f0">Text("确认下单")</text>
  <text class="m" x="84" y="244" font-size="11.5" fill="#e2e8f0">Text("共 3 件商品")</text>
  <text class="m" x="84" y="284" font-size="11" fill="#fbbf24">海外用户: 全是中文</text>
  <text class="m" x="84" y="304" font-size="11" fill="#f87171">视障用户: 按钮无标签</text>
  <polygon points="470,238 486,238 478,252" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <rect x="388" y="178" width="156" height="60" rx="12" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <text class="t" x="466" y="202" text-anchor="middle" font-size="12.5" fill="#475569">文字写死在代码里，</text>
  <text class="t" x="466" y="222" text-anchor="middle" font-size="12.5" fill="#475569">读屏软件读不出按钮</text>
  <use href="#swifty" transform="translate(492,332) scale(0.5)"/>
  <text class="t an" x="64" y="352">国际化和无障碍不是上线后补丁，是从第一行代码就要做的基建</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="642" cy="146" r="14" fill="#007AFF"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text class="t pt" x="668" y="152">机制登场 · String Catalog + a11y 四层</text>
  <rect x="636" y="176" width="230" height="60" rx="12" fill="#eff6ff" stroke="#007AFF" stroke-width="2.5"/>
  <text class="t" x="650" y="200" font-size="13" font-weight="bold" fill="#1e293b">String Catalog</text>
  <text class="t" x="650" y="222" font-size="11.5" fill="#64748b">Xcode 自动收集字符串，多语言集中翻译</text>
  <rect x="880" y="176" width="260" height="60" rx="12" fill="#f5f3ff" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="t" x="894" y="200" font-size="13" font-weight="bold" fill="#1e293b">无障碍四层模型</text>
  <text class="t" x="894" y="222" font-size="11.5" fill="#64748b">语义/标签/值/特征，读屏软件依赖</text>
  <rect x="636" y="250" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="270" font-size="13" fill="#475569">CLDR 复数规则：英语 1 件/2 件，俄语 1/2-4/5+ 三套变形</text>
  <rect x="636" y="286" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="306" font-size="13" fill="#475569">伪本地化（Pseudo-localization）提前发现硬编码和布局溢出</text>
  <text class="t" x="648" y="354" font-size="15" font-weight="bold" fill="#007AFF">「i18n 让 App 走遍全球，a11y 让人人都能用 App」</text>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="416" r="14" fill="#f59e0b"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 本地化流程 + a11y 适配</text>
  <circle cx="76" cy="450" r="12" fill="#F05138"/>
  <text class="t" x="76" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text class="t" x="100" y="454" font-size="14" font-weight="bold" fill="#1e293b">字符串全走 Localized</text>
  <text class="t an" x="100" y="474">String Catalog 收集，禁止硬编码</text>
  <line x1="76" y1="466" x2="76" y2="490" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="504" r="12" fill="#007AFF"/>
  <text class="t" x="76" y="509" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text class="t" x="100" y="508" font-size="14" font-weight="bold" fill="#1e293b">加 a11y 标签</text>
  <text class="t an" x="100" y="528">.accessibilityLabel/Value/Hint</text>
  <line x1="76" y1="520" x2="76" y2="544" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="558" r="12" fill="#7C3AED"/>
  <text class="t" x="76" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text class="t" x="100" y="562" font-size="14" font-weight="bold" fill="#1e293b">CI 跑伪本地化</text>
  <text class="t an" x="100" y="582">自动发现硬编码和布局溢出</text>
  <rect x="360" y="428" width="780" height="176" rx="12" fill="#1e293b" stroke="#007AFF" stroke-width="2.5"/>
  <text class="m" x="380" y="452" font-size="11" fill="#94a3b8">// 本地化 + 无障碍：一行代码两件事</text>
  <text class="m" x="380" y="476" font-size="12" fill="#e2e8f0">Button {</text>
  <text class="m" x="396" y="496" font-size="12" fill="#e2e8f0">vm.confirmOrder()</text>
  <text class="m" x="380" y="516" font-size="12" fill="#e2e8f0">} label: {</text>
  <text class="m" x="396" y="536" font-size="12" fill="#e2e8f0">Text(<tspan fill="#8fd14f">"order.confirm"</tspan>, bundle: .module)  <tspan fill="#94a3b8">// i18n</tspan></text>
  <text class="m" x="380" y="556" font-size="12" fill="#e2e8f0">}</text>
  <text class="m" x="380" y="578" font-size="12" fill="#e2e8f0">.accessibilityLabel(<tspan fill="#8fd14f">"order.confirm.a11y"</tspan>)  <tspan fill="#94a3b8">// a11y</tspan></text>
  <text class="m" x="380" y="600" font-size="11" fill="#94a3b8">// 复数: Text("items.count \(count)") → CLDR 自动选 1/2-4/5+ 形式</text>

