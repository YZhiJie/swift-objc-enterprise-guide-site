  <rect x="0" y="0" width="1200" height="840" fill="#f0f4fa"/>
  <circle cx="180" cy="64" r="60" fill="#F05138" opacity="0.05"/>
  <circle cx="1120" cy="120" r="80" fill="#007AFF" opacity="0.05"/>
  <circle cx="1100" cy="760" r="70" fill="#7C3AED" opacity="0.04"/>
  <circle cx="140" cy="780" r="50" fill="#F05138" opacity="0.04"/>

  <!-- ===== 顶部横幅 ===== -->
  <rect x="40" y="6" width="120" height="6" rx="3" fill="#F05138"/>
  <rect x="40" y="16" width="120" height="6" rx="3" fill="#007AFF"/>
  <text class="t st" x="40" y="40">Swift &amp; ObjC 学园 · 漫画支部</text>
  <text class="t bt" x="40" y="80">第 1 话 · Swift 基础 — 可选类型与值引用</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#F05138"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">EP.01</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#c8d3e8" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="146" r="14" fill="#F05138"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · nil 突袭崩溃</text>
  <rect x="64" y="176" width="280" height="150" rx="12" fill="#1e293b" stroke="#e5484d" stroke-width="2.5"/>
  <circle cx="84" cy="194" r="5.5" fill="#ff6b6b"/>
  <circle cx="102" cy="194" r="5.5" fill="#ffd166"/>
  <circle cx="120" cy="194" r="5.5" fill="#4cd97b"/>
  <text class="m" x="84" y="222" font-size="12" fill="#e2e8f0">let name = dict["name"]</text>
  <text class="m" x="84" y="244" font-size="12" fill="#e2e8f0">print(name.count)</text>
  <text class="m" x="84" y="276" font-size="11" fill="#fbbf24">Fatal error:</text>
  <text class="m" x="84" y="296" font-size="11" fill="#f87171">Unexpectedly found nil</text>
  <polygon points="470,238 486,238 478,252" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <rect x="388" y="178" width="156" height="60" rx="12" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <text class="t" x="466" y="202" text-anchor="middle" font-size="12.5" fill="#475569">字典里没有这个 key</text>
  <text class="t" x="466" y="222" text-anchor="middle" font-size="12.5" fill="#475569">我直接解包就崩了……</text>
  <use href="#swifty" transform="translate(492,332) scale(0.5)"/>
  <text class="t an" x="64" y="352">在 ObjC 里给 nil 发消息没事，但 Swift 的 ! 会直接炸</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="642" cy="146" r="14" fill="#007AFF"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text class="t pt" x="668" y="152">机制登场 · Optional 与值引用二分</text>
  <rect x="636" y="176" width="230" height="60" rx="12" fill="#fff7ed" stroke="#F05138" stroke-width="2.5"/>
  <text class="t" x="650" y="200" font-size="13" font-weight="bold" fill="#1e293b">Optional&lt;T&gt; = T ? nil</text>
  <text class="t" x="650" y="222" font-size="11.5" fill="#64748b">编译期就把「可能为空」写进类型</text>
  <rect x="880" y="176" width="260" height="60" rx="12" fill="#eff6ff" stroke="#007AFF" stroke-width="2.5"/>
  <text class="t" x="894" y="200" font-size="13" font-weight="bold" fill="#1e293b">struct 值类型 / class 引用类型</text>
  <text class="t" x="894" y="222" font-size="11.5" fill="#64748b">值拷贝 vs 指针共享，选对少一半 bug</text>
  <rect x="636" y="250" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="270" font-size="13" fill="#475569">字典取值返回 String? —— 要么是 String，要么是 nil，编译器逼你处理</text>
  <rect x="636" y="286" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="306" font-size="13" fill="#475569">可选链 name?.count —— 链上任一为 nil，整条短路返回 nil</text>
  <text class="t" x="648" y="354" font-size="15" font-weight="bold" fill="#007AFF">「类型系统替你守住空指针，不用靠记忆力」</text>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="416" r="14" fill="#f59e0b"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 安全解包三式 + 类型选型</text>
  <circle cx="76" cy="450" r="12" fill="#F05138"/>
  <text class="t" x="76" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text class="t" x="100" y="454" font-size="14" font-weight="bold" fill="#1e293b">if let 解包后使用</text>
  <text class="t an" x="100" y="474">有值才进分支，作用域内非空</text>
  <line x1="76" y1="466" x2="76" y2="490" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="504" r="12" fill="#007AFF"/>
  <text class="t" x="76" y="509" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text class="t" x="100" y="508" font-size="14" font-weight="bold" fill="#1e293b">guard let 提前 return</text>
  <text class="t an" x="100" y="528">失败早退出，主流程不缩进</text>
  <line x1="76" y1="520" x2="76" y2="544" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="558" r="12" fill="#7C3AED"/>
  <text class="t" x="76" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text class="t" x="100" y="562" font-size="14" font-weight="bold" fill="#1e293b">?? 给默认值兜底</text>
  <text class="t an" x="100" y="582">nil 时用默认值，表达式一行搞定</text>
  <rect x="360" y="428" width="780" height="176" rx="12" fill="#1e293b" stroke="#007AFF" stroke-width="2.5"/>
  <text class="m" x="380" y="452" font-size="11" fill="#94a3b8">// 三种安全解包，告别强制解包 !</text>
  <text class="m" x="380" y="476" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">if let</tspan> name = dict[<tspan fill="#8fd14f">"name"</tspan>] {</text>
  <text class="m" x="396" y="496" font-size="12" fill="#e2e8f0">print(name.count)  <tspan fill="#94a3b8">// name 保证非空</tspan></text>
  <text class="m" x="380" y="516" font-size="12" fill="#e2e8f0">}</text>
  <text class="m" x="380" y="540" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">guard let</tspan> id = dict[<tspan fill="#8fd14f">"id"</tspan>] <tspan fill="#c084fc">else</tspan> { <tspan fill="#c084fc">return</tspan> }</text>
  <text class="m" x="380" y="562" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">let</tspan> count = dict[<tspan fill="#8fd14f">"n"</tspan>]?.count ?? <tspan fill="#fbbf24">0</tspan></text>
  <text class="m" x="380" y="588" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">struct</tspan> User {} <tspan fill="#94a3b8">// 值类型，赋值即拷贝</tspan></text>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <use href="#elder" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">Runtime 长老划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">Optional 把「可能为空」写进类型，编译器替你守住空指针</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">安全解包三式：if let / guard let / ??，生产禁用强制 !</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">值类型用 struct 拷贝、引用类型用 class 共享，选型先问「要不要共享」</text>
  <rect x="1000" y="700" width="140" height="32" rx="16" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="1070" y="721" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">EP.01 · Swift 基础</text>

  <text class="t ft" x="40" y="822">银翼工坊 Silverwing Workshop · 第 1 话 — 深入阅读 01-swift-basics.md · 动手去 NullSafety 实验场</text>
</svg>
