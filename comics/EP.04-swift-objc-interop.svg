  <rect x="0" y="0" width="1200" height="840" fill="#f0f4fa"/>
  <circle cx="180" cy="64" r="60" fill="#F05138" opacity="0.05"/>
  <circle cx="1120" cy="120" r="80" fill="#007AFF" opacity="0.05"/>
  <circle cx="1100" cy="760" r="70" fill="#7C3AED" opacity="0.04"/>
  <circle cx="140" cy="780" r="50" fill="#F05138" opacity="0.04"/>

  <rect x="40" y="6" width="120" height="6" rx="3" fill="#F05138"/>
  <rect x="40" y="16" width="120" height="6" rx="3" fill="#007AFF"/>
  <text class="t st" x="40" y="40">Swift &amp; ObjC 学园 · 漫画支部</text>
  <text class="t bt" x="40" y="80">第 4 话 · 混编 — 桥接头与渐进迁移</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#F05138"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">EP.04</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#c8d3e8" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="146" r="14" fill="#F05138"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 双向找不到符号</text>
  <rect x="64" y="176" width="270" height="150" rx="12" fill="#1e293b" stroke="#e5484d" stroke-width="2.5"/>
  <circle cx="84" cy="194" r="5.5" fill="#ff6b6b"/>
  <circle cx="102" cy="194" r="5.5" fill="#ffd166"/>
  <circle cx="120" cy="194" r="5.5" fill="#4cd97b"/>
  <text class="m" x="84" y="222" font-size="11.5" fill="#e2e8f0">// Swift 文件里</text>
  <text class="m" x="84" y="242" font-size="11.5" fill="#e2e8f0">let vc = OldObjCViewController()</text>
  <text class="m" x="84" y="282" font-size="11" fill="#f87171">Cannot find 'OldObjC...'</text>
  <text class="m" x="84" y="304" font-size="11" fill="#f87171">in scope</text>
  <polygon points="470,238 486,238 478,252" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <rect x="388" y="178" width="156" height="60" rx="12" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <text class="t" x="466" y="202" text-anchor="middle" font-size="12.5" fill="#475569">Swift 不认 ObjC 类，</text>
  <text class="t" x="466" y="222" text-anchor="middle" font-size="12.5" fill="#475569">ObjC 也找不到 Swift 方法</text>
  <use href="#swifty" transform="translate(492,332) scale(0.5)"/>
  <text class="t an" x="64" y="352">两种语言各有一套符号表，中间缺一座桥</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="642" cy="146" r="14" fill="#007AFF"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 桥接头与 @objc 映射</text>
  <rect x="636" y="176" width="230" height="60" rx="12" fill="#fff7ed" stroke="#F05138" stroke-width="2.5"/>
  <text class="t" x="650" y="200" font-size="13" font-weight="bold" fill="#1e293b">桥接头 .h（ObjC→Swift）</text>
  <text class="t" x="650" y="222" font-size="11.5" fill="#64748b">import 进桥接头的 ObjC 头，Swift 可见</text>
  <rect x="880" y="176" width="260" height="60" rx="12" fill="#f5f3ff" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="t" x="894" y="200" font-size="13" font-weight="bold" fill="#1e293b">@objc 标记（Swift→ObjC）</text>
  <text class="t" x="894" y="222" font-size="11.5" fill="#64748b">标了 @objc 的类/方法才暴露给 ObjC</text>
  <rect x="636" y="250" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="270" font-size="13" fill="#475569">nullability 注解（nonnull/nullable）把 ObjC 指针映射成 Swift 的 Optional</text>
  <rect x="636" y="286" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="306" font-size="13" fill="#475569">NS_SWIFT_NAME / NS_REFINED_FOR_SWIFT 自定义 Swift 侧的命名</text>
  <text class="t" x="648" y="354" font-size="15" font-weight="bold" fill="#007AFF">「双向各一座桥：桥接头让 Swift 看见 ObjC，@objc 让 ObjC 看见 Swift」</text>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="416" r="14" fill="#f59e0b"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 渐进迁移三步走</text>
  <circle cx="76" cy="450" r="12" fill="#F05138"/>
  <text class="t" x="76" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text class="t" x="100" y="454" font-size="14" font-weight="bold" fill="#1e293b">先补注解，不删代码</text>
  <text class="t an" x="100" y="474">给 ObjC 头加 nullability，Swift 侧拿到正确 Optional</text>
  <line x1="76" y1="466" x2="76" y2="490" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="504" r="12" fill="#007AFF"/>
  <text class="t" x="76" y="509" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text class="t" x="100" y="508" font-size="14" font-weight="bold" fill="#1e293b">新功能用 Swift 写</text>
  <text class="t an" x="100" y="528">通过 @objc 暴露给老 ObjC 调用，双轨共存</text>
  <line x1="76" y1="520" x2="76" y2="544" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="558" r="12" fill="#7C3AED"/>
  <text class="t" x="76" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text class="t" x="100" y="562" font-size="14" font-weight="bold" fill="#1e293b">逐个模块替换</text>
  <text class="t an" x="100" y="582">改一个测一个，最后删空 ObjC 目标</text>
  <rect x="360" y="428" width="780" height="176" rx="12" fill="#1e293b" stroke="#007AFF" stroke-width="2.5"/>
  <text class="m" x="380" y="452" font-size="11" fill="#94a3b8">// ObjC 头加注解 → Swift 拿到 String? 而不是 String!</text>
  <text class="m" x="380" y="476" font-size="12" fill="#e2e8f0">- (nullable NSString *)nameForID:(nonnull NSString *)uid;</text>
  <text class="m" x="380" y="504" font-size="11" fill="#94a3b8">// Swift 侧暴露给 ObjC</text>
  <text class="m" x="380" y="528" font-size="12" fill="#e2e8f0">@objc <tspan fill="#c084fc">class</tspan> SwiftService: NSObject {</text>
  <text class="m" x="396" y="548" font-size="12" fill="#e2e8f0">@objc <tspan fill="#c084fc">func</tspan> fetch() -&gt; String { <tspan fill="#8fd14f">"ok"</tspan> }</text>
  <text class="m" x="380" y="568" font-size="12" fill="#e2e8f0">}</text>
  <text class="m" x="380" y="592" font-size="11" fill="#94a3b8">// ObjC 调用：SwiftService *s = [SwiftService new]; [s fetch];</text>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <use href="#elder" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">Runtime 长老划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">ObjC→Swift 靠桥接头，Swift→ObjC 靠 @objc，两座桥缺一不可</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">nullability 注解把 ObjC 指针精确映射成 Swift Optional，消除隐式解包</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">迁移策略：先补注解→新功能 Swift 写→逐模块替换，禁止大爆炸重写</text>
  <rect x="1000" y="700" width="140" height="32" rx="16" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="1070" y="721" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">EP.04 · 混编</text>

  <text class="t ft" x="40" y="822">银翼工坊 Silverwing Workshop · 第 4 话 — 深入阅读 04-swift-objc-interop.md · 动手去 InteropDemo 实验场</text>
</svg>
