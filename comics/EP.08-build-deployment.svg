  <text class="t" x="76" y="509" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text class="t" x="100" y="508" font-size="14" font-weight="bold" fill="#1e293b">合并触发 archive</text>
  <text class="t an" x="100" y="528">fastlane gym 出 ipa，match 自动签名</text>
  <line x1="76" y1="520" x2="76" y2="544" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="558" r="12" fill="#7C3AED"/>
  <text class="t" x="76" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text class="t" x="100" y="562" font-size="14" font-weight="bold" fill="#1e293b">发布 TestFlight / App Store</text>
  <text class="t an" x="100" y="582">fastlane pilot 上传，pilot 自动分发给测试</text>
  <rect x="380" y="428" width="760" height="176" rx="12" fill="#1e293b" stroke="#007AFF" stroke-width="2.5"/>
  <text class="m" x="400" y="452" font-size="11" fill="#94a3b8">// fastlane Fastfile：一行命令出包上架</text>
  <text class="m" x="400" y="476" font-size="12" fill="#e2e8f0">lane :release <tspan fill="#c084fc">do</tspan></text>
  <text class="m" x="416" y="496" font-size="12" fill="#e2e8f0">match(type: <tspan fill="#8fd14f">"appstore"</tspan>)  <tspan fill="#94a3b8"># 拉证书</tspan></text>
  <text class="m" x="416" y="516" font-size="12" fill="#e2e8f0">gym(scheme: <tspan fill="#8fd14f">"MyApp"</tspan>)     <tspan fill="#94a3b8"># 出 ipa</tspan></text>
  <text class="m" x="416" y="536" font-size="12" fill="#e2e8f0">pilot                    <tspan fill="#94a3b8"># 上传 TestFlight</tspan></text>
  <text class="m" x="400" y="556" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">end</tspan></text>
  <text class="m" x="400" y="584" font-size="11" fill="#94a3b8">// CI 执行: fastlane release，全链路无人值守</text>

