  <text class="t pt" x="668" y="152">机制登场 · 签名三件套与 fastlane</text>
  <rect x="636" y="176" width="230" height="60" rx="12" fill="#eff6ff" stroke="#007AFF" stroke-width="2.5"/>
  <text class="t" x="650" y="200" font-size="13" font-weight="bold" fill="#1e293b">证书 + 描述文件</text>
  <text class="t" x="650" y="222" font-size="11.5" fill="#64748b">证明你是谁 + 允许哪些设备/权限</text>
  <rect x="880" y="176" width="260" height="60" rx="12" fill="#f5f3ff" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="t" x="894" y="200" font-size="13" font-weight="bold" fill="#1e293b">fastlane 自动化</text>
  <text class="t" x="894" y="222" font-size="11.5" fill="#64748b">match 管证书 / gym 打包 / pilot 上架</text>
  <rect x="636" y="250" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="270" font-size="13" fill="#475569">xcconfig 分离配置：Debug / Release 各一套，不污染 project.pbxproj</text>
  <rect x="636" y="286" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="306" font-size="13" fill="#475569">macOS 公证（Notarization）：上传 Apple 扫描恶意代码，通过才能分发</text>
  <text class="t" x="648" y="354" font-size="15" font-weight="bold" fill="#007AFF">「签名不是玄学：证书证明身份，描述文件授权，fastlane 全自动」</text>

  <!-- ===== 格3 · 落地收束 ===== -->
