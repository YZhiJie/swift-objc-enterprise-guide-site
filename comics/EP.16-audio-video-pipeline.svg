  <text class="m" x="290" y="502" text-anchor="middle" font-size="9" fill="#92400e">preprocess</text>
  <!-- 大节点：编码 -->
  <rect x="360" y="452" width="150" height="64" rx="10" fill="#007AFF" stroke="#005ec4" stroke-width="2"/>
  <text class="t" x="435" y="478" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">编码</text>
  <text class="m" x="435" y="498" text-anchor="middle" font-size="9.5" fill="#dbeafe">encode · 耗时/码率/GOP</text>
  <!-- 小节点：封装 -->
  <rect x="532" y="466" width="96" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text class="t" x="580" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">封装</text>
  <text class="m" x="580" y="502" text-anchor="middle" font-size="9" fill="#4338ca">mux</text>
  <!-- 大节点：传输 -->
  <rect x="650" y="452" width="150" height="64" rx="10" fill="#e5484d" stroke="#b91c1c" stroke-width="2"/>
  <rect x="646" y="448" width="158" height="72" rx="12" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="t" x="725" y="478" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">传输</text>
  <text class="m" x="725" y="498" text-anchor="middle" font-size="9.5" fill="#ffe4e6">send · RTT/丢包/重连</text>
  <!-- 小节点：分发 -->
  <rect x="822" y="466" width="96" height="44" rx="8" fill="#f0fdf4" stroke="#34a853" stroke-width="2"/>
  <text class="t" x="870" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">分发</text>
  <text class="m" x="870" y="502" text-anchor="middle" font-size="9" fill="#166534">CDN / TTFB</text>
  <!-- 大节点：播放 -->
  <rect x="940" y="452" width="150" height="64" rx="10" fill="#7C3AED" stroke="#5b21b6" stroke-width="2"/>
  <text class="t" x="1015" y="478" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">播放</text>
  <text class="m" x="1015" y="498" text-anchor="middle" font-size="9.5" fill="#ede9fe">play · 首帧/卡顿</text>

