  <text class="t st" x="40" y="40">Swift &amp; ObjC 学园 · 漫画支部</text>
  <text class="t bt" x="40" y="80">第 16 话 · 开播即卡 — 七跳链路与弱网治理</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#F05138"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">EP.16</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#c8d3e8" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="146" r="14" fill="#F05138"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 开播 5 秒黑屏</text>

  <rect x="64" y="176" width="150" height="150" rx="10" fill="#1e293b" stroke="#e5484d" stroke-width="2.5"/>
  <rect x="88" y="186" width="102" height="6" rx="3" fill="#334155"/>
  <circle cx="139" cy="236" r="17" fill="none" stroke="#f87171" stroke-width="3"/>
  <path d="M 139 222 L 139 236 L 149 244" stroke="#f87171" stroke-width="3" fill="none"/>
  <text class="t" x="139" y="288" text-anchor="middle" font-size="12" fill="#f87171">开播 5s：黑屏</text>
  <text class="t" x="139" y="306" text-anchor="middle" font-size="11" fill="#94a3b8">预览窗一直转圈</text>

  <rect x="230" y="176" width="130" height="56" rx="10" fill="#fff1f2" stroke="#e5484d" stroke-width="2"/>
  <text class="t" x="242" y="196" font-size="11.5" fill="#9f1239">在线人数</text>
  <text class="m" x="242" y="218" font-size="17" font-weight="bold" fill="#e5484d">1200 → 300</text>

  <rect x="230" y="242" width="130" height="56" rx="10" fill="#ecfdf5" stroke="#34a853" stroke-width="2"/>
  <text class="t" x="242" y="262" font-size="11.5" fill="#166534">服务端大盘</text>
  <text class="t" x="242" y="282" font-size="13" font-weight="bold" fill="#166534">全绿 · 无报警</text>
  <rect x="242" y="290" width="18" height="4" rx="2" fill="#34a853"/>
  <rect x="266" y="290" width="18" height="4" rx="2" fill="#34a853"/>
  <rect x="290" y="290" width="18" height="4" rx="2" fill="#34a853"/>

  <rect x="376" y="176" width="150" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="t" x="388" y="199" font-size="12" fill="#475569">弹幕：卡了 / 主播跑路？</text>
  <rect x="376" y="228" width="150" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="t" x="388" y="251" font-size="12" fill="#475569">客服：全在说黑屏</text>

  <text class="t an" x="64" y="352">机房说没事、用户说没法看：卡的不是服务，是链路</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="642" cy="146" r="14" fill="#007AFF"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text class="t pt" x="668" y="152">弱网三件套 · 先保连续</text>

  <rect x="636" y="176" width="164" height="112" rx="10" fill="#f8fafc" stroke="#c8d3e8" stroke-width="2"/>
  <text class="t" x="648" y="196" font-size="12" font-weight="bold" fill="#1e293b">码率阶梯（ABR）</text>
  <rect x="648" y="206" width="128" height="12" rx="6" fill="#F05138"/>
  <text class="m" x="770" y="216" text-anchor="end" font-size="9.5" fill="#475569">4M</text>
  <rect x="648" y="226" width="96" height="12" rx="6" fill="#f97316"/>
  <text class="m" x="770" y="236" text-anchor="end" font-size="9.5" fill="#475569">2.5M</text>
  <rect x="648" y="246" width="72" height="12" rx="6" fill="#fbbf24"/>
  <text class="m" x="770" y="256" text-anchor="end" font-size="9.5" fill="#475569">1.8M</text>
  <rect x="648" y="266" width="52" height="12" rx="6" fill="#94a3b8"/>
  <text class="m" x="770" y="276" text-anchor="end" font-size="9.5" fill="#475569">1.2M</text>

  <rect x="812" y="176" width="158" height="112" rx="10" fill="#f8fafc" stroke="#c8d3e8" stroke-width="2"/>
  <text class="t" x="824" y="196" font-size="12" font-weight="bold" fill="#1e293b">FEC + NACK</text>
  <rect x="824" y="208" width="20" height="16" rx="3" fill="#007AFF"/>
  <rect x="848" y="208" width="20" height="16" rx="3" fill="#007AFF"/>
  <rect x="872" y="208" width="20" height="16" rx="3" fill="#007AFF"/>
  <rect x="896" y="208" width="20" height="16" rx="3" fill="#007AFF"/>
  <rect x="920" y="208" width="20" height="16" rx="3" fill="#bfdbfe"/>
  <text class="t" x="824" y="240" font-size="10.5" fill="#475569">关键帧 FEC 冗余 20%</text>
  <text class="t" x="824" y="258" font-size="10.5" fill="#475569">普通帧 NACK 最多 2 次</text>
  <text class="t" x="824" y="276" font-size="10.5" fill="#64748b">重传超 200ms 直接放弃</text>

  <rect x="982" y="176" width="158" height="112" rx="10" fill="#f8fafc" stroke="#c8d3e8" stroke-width="2"/>
  <text class="t" x="994" y="196" font-size="12" font-weight="bold" fill="#1e293b">抖动缓冲</text>
  <rect x="994" y="206" width="132" height="52" rx="6" fill="#e0f2fe" stroke="#007AFF" stroke-width="2"/>
  <rect x="994" y="236" width="132" height="22" rx="0" fill="#7dd3fc"/>
  <line x1="994" y1="236" x2="1126" y2="236" stroke="#007AFF" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="t" x="994" y="232" font-size="10" fill="#075985">目标水位 150ms</text>
  <text class="t" x="994" y="272" font-size="10" fill="#475569">depth = P95 × 2 + 30ms</text>
  <text class="t" x="994" y="286" font-size="10" fill="#475569">minDepth 不低于 60ms</text>

  <text class="t" x="648" y="314" font-size="11.5" fill="#166534">升档四条件：缓冲 ≥2s · 吞吐 ≥1.4× · 丢包小于 2% · RTT 小于 200ms</text>
  <text class="t" x="648" y="334" font-size="11.5" fill="#9f1239">无条件降档：缓冲小于 300ms；安全降档：丢包 ≥8% 且缓冲小于 1.5s</text>

  <!-- ===== 格3 · 七跳链路 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="416" r="14" fill="#f59e0b"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text class="t pt" x="92" y="422">七跳链路 · 每一跳打同口径 signpost</text>

  <!-- 大节点：采集 -->
  <rect x="70" y="452" width="150" height="64" rx="10" fill="#F05138" stroke="#c93a25" stroke-width="2"/>
