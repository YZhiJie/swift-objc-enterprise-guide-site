  <rect x="700" y="528" width="100" height="26" rx="13" fill="#fff1f2" stroke="#e5484d" stroke-width="2"/>
  <text class="t" x="750" y="546" text-anchor="middle" font-size="11" font-weight="bold" fill="#9f1239">丢包 8% · 缓冲 300ms</text>

  <line x1="70" y1="572" x2="1090" y2="572" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="m" x="70" y="566" font-size="10.5" fill="#64748b">t0 开播</text>
  <text class="m" x="1090" y="566" text-anchor="end" font-size="10.5" fill="#64748b">首帧上屏</text>
  <text class="t" x="70" y="598" font-size="11.5" fill="#475569">七跳里任意一跳缺打点，故障就会被踢皮球：先统一 stage 名（capture / encode / send / play），再谈优化。</text>
  <text class="t" x="70" y="616" font-size="11.5" fill="#475569">协议选型：RTMP 2~10s 上行 · SRT 200ms~2s 抗弱网 · WebRTC 100~400ms 互动</text>

  <!-- ===== 知识条（单条大字） ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <use href="#elder" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">Runtime 长老划重点</text>
  <rect x="238" y="690" width="880" height="66" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text class="t" x="262" y="729" font-size="18" font-weight="bold" fill="#78350f">先把七跳各打一个同口径的 signpost，再谈优化；否则「卡」永远只能靠猜。</text>
