  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="146" r="14" fill="#F05138"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 大盘全绿，用户卡顿</text>

  <rect x="64" y="176" width="168" height="126" rx="10" fill="#ecfdf5" stroke="#34a853" stroke-width="2.5"/>
  <text class="t" x="78" y="196" font-size="12" font-weight="bold" fill="#166534">季度大盘（只报均值）</text>
  <text class="m" x="78" y="226" font-size="20" font-weight="bold" fill="#166534">99.1%</text>
  <text class="t" x="78" y="244" font-size="10.5" fill="#15803d">播放成功率 · 环比 +0.2%</text>
  <circle cx="84" cy="264" r="7" fill="#34a853"/>
  <text class="t" x="98" y="268" font-size="11" fill="#166534">三盏绿灯</text>
  <circle cx="84" cy="286" r="7" fill="#34a853"/>
  <text class="t" x="98" y="290" font-size="11" fill="#166534">服务端稳定</text>

  <rect x="246" y="176" width="132" height="126" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="268" y="186" width="88" height="6" rx="3" fill="#334155"/>
  <circle cx="312" cy="232" r="16" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <path d="M 312 218 L 312 232 L 322 240" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <text class="t" x="312" y="272" text-anchor="middle" font-size="11" fill="#fbbf24">首帧 3.2s</text>
  <text class="t" x="312" y="290" text-anchor="middle" font-size="10" fill="#94a3b8">P90 从未上报</text>

  <rect x="396" y="176" width="132" height="58" rx="10" fill="#fff1f2" stroke="#e5484d" stroke-width="2"/>
  <text class="t" x="408" y="196" font-size="11" fill="#9f1239">缺失分位数</text>
  <text class="m" x="408" y="218" font-size="13" font-weight="bold" fill="#e5484d">P90 / P95 未埋点</text>
  <rect x="396" y="244" width="132" height="58" rx="10" fill="#fff1f2" stroke="#e5484d" stroke-width="2"/>
  <text class="t" x="408" y="264" font-size="11" fill="#9f1239">口径错配</text>
  <text class="t" x="408" y="284" font-size="10.5" fill="#9f1239">均值 ≠ 尾部体验</text>

  <text class="t an" x="64" y="352">三盏绿灯照不到尾部的 5%，但用户就卡在那 5% 里</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="642" cy="146" r="14" fill="#007AFF"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text class="t pt" x="668" y="152">口径对齐 · 三个数说清体验</text>

  <rect x="636" y="176" width="160" height="104" rx="10" fill="#f8fafc" stroke="#c8d3e8" stroke-width="2"/>
  <text class="t" x="648" y="196" font-size="12" font-weight="bold" fill="#1e293b">卡顿工单（一张就够）</text>
  <line x1="648" y1="210" x2="784" y2="210" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="m" x="648" y="228" font-size="9.5" fill="#475569">session_id</text>
  <text class="m" x="648" y="244" font-size="9.5" fill="#475569">stage=play, reason</text>
  <text class="m" x="648" y="260" font-size="9.5" fill="#475569">stall_ms, buffer_ms</text>
  <text class="t" x="648" y="274" font-size="9.5" fill="#94a3b8">P90 只对成功会话统计</text>

  <circle cx="858" cy="196" r="18" fill="#e0f2fe" stroke="#007AFF" stroke-width="2"/>
  <line x1="858" y1="184" x2="858" y2="196" stroke="#0284c7" stroke-width="2"/>
  <line x1="858" y1="196" x2="868" y2="204" stroke="#0284c7" stroke-width="2"/>
  <text class="t" x="858" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#075985">首帧 = 上屏 - 开播</text>
  <text class="t" x="858" y="256" text-anchor="middle" font-size="10" fill="#475569">TTFF 只减不猜</text>

  <rect x="636" y="290" width="330" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t" x="646" y="308" font-size="10.5" fill="#475569">卡顿率 = 卡顿会话数 / 播放会话数（分母必须同口径）</text>
  <text class="t" x="646" y="328" font-size="10.5" fill="#475569">成功率 = 成功播放 / 一次尝试；TTFF 取 P90 与 P95 两条线</text>

  <rect x="982" y="176" width="158" height="134" rx="10" fill="#f0f9ff" stroke="#007AFF" stroke-width="2"/>
  <text class="t" x="994" y="196" font-size="11.5" font-weight="bold" fill="#075985">漏斗（同口径）</text>
  <text class="m" x="994" y="220" font-size="10" fill="#475569">开播 1000</text>
  <rect x="994" y="228" width="100" height="10" rx="5" fill="#007AFF"/>
  <text class="m" x="994" y="252" font-size="10" fill="#475569">成功 942</text>
  <rect x="994" y="260" width="75" height="10" rx="5" fill="#38bdf8"/>
  <text class="m" x="994" y="284" font-size="10" fill="#475569">首帧 900</text>
  <rect x="994" y="292" width="60" height="10" rx="5" fill="#7dd3fc"/>

  <text class="t" x="636" y="364" font-size="11.5" fill="#9f1239">红线：P90 首帧 ≥1.5s</text>
  <text class="t" x="760" y="364" font-size="11.5" fill="#9f1239">每会话卡顿 ≥1.2 次</text>

  <!-- ===== 格3 · 门禁四枚徽章 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="416" r="14" fill="#f59e0b"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text class="t pt" x="92" y="422">发布门禁 · 四枚红绿灯</text>

  <!-- 徽章 1 -->
  <rect x="70" y="440" width="230" height="112" rx="12" fill="#f0fdf4" stroke="#34a853" stroke-width="2"/>
  <rect x="82" y="452" width="34" height="72" rx="8" fill="#1e293b"/>
  <circle cx="99" cy="468" r="8" fill="#4b5563"/>
  <circle cx="99" cy="488" r="8" fill="#4b5563"/>
  <circle cx="99" cy="508" r="8" fill="#22c55e"/>
  <text class="t" x="128" y="463" font-size="11.5" fill="#166534">① 崩溃率</text>
  <text class="m" x="128" y="486" font-size="17" font-weight="bold" fill="#14532d">0.05%</text>
  <text class="t" x="128" y="506" font-size="11.5" font-weight="bold" fill="#15803d">绿灯 · 通过</text>
  <text class="t" x="128" y="524" font-size="9.5" fill="#64748b">n=1200 万会话</text>
  <text class="t" x="128" y="540" font-size="9.5" fill="#64748b">阈值 ≤0.15%</text>

  <!-- 徽章 2 -->
  <rect x="330" y="440" width="230" height="112" rx="12" fill="#f0fdf4" stroke="#34a853" stroke-width="2"/>
  <rect x="342" y="452" width="34" height="72" rx="8" fill="#1e293b"/>
  <circle cx="359" cy="468" r="8" fill="#4b5563"/>
  <circle cx="359" cy="488" r="8" fill="#4b5563"/>
  <circle cx="359" cy="508" r="8" fill="#22c55e"/>
  <text class="t" x="388" y="463" font-size="11.5" fill="#166534">② 成功率</text>
  <text class="m" x="388" y="486" font-size="17" font-weight="bold" fill="#14532d">99.1%</text>
  <text class="t" x="388" y="506" font-size="11.5" font-weight="bold" fill="#15803d">绿灯 · 通过</text>
  <text class="t" x="388" y="524" font-size="9.5" fill="#64748b">n=86 万会话</text>
  <text class="t" x="388" y="540" font-size="9.5" fill="#64748b">阈值 ≥97%</text>

  <!-- 徽章 3 -->
  <rect x="590" y="440" width="230" height="112" rx="12" fill="#f0fdf4" stroke="#34a853" stroke-width="2"/>
  <rect x="602" y="452" width="34" height="72" rx="8" fill="#1e293b"/>
  <circle cx="619" cy="468" r="8" fill="#4b5563"/>
  <circle cx="619" cy="488" r="8" fill="#4b5563"/>
  <circle cx="619" cy="508" r="8" fill="#22c55e"/>
  <text class="t" x="648" y="463" font-size="11.5" fill="#166534">③ 卡顿 + 首帧</text>
  <text class="m" x="648" y="486" font-size="15" font-weight="bold" fill="#14532d">0.73 次 / 1.2s</text>
  <text class="t" x="648" y="506" font-size="11.5" font-weight="bold" fill="#15803d">绿灯 · 通过</text>
  <text class="t" x="648" y="524" font-size="9.5" fill="#64748b">n=800 万会话</text>
  <text class="t" x="648" y="540" font-size="9.5" fill="#64748b">阈值 ≤1.2 次 / ≤1.5s</text>

  <!-- 徽章 4 -->
  <rect x="850" y="440" width="230" height="112" rx="12" fill="#fff1f2" stroke="#e5484d" stroke-width="2.5"/>
  <rect x="862" y="452" width="34" height="72" rx="8" fill="#1e293b"/>
  <circle cx="879" cy="468" r="8" fill="#ef4444"/>
  <circle cx="879" cy="488" r="8" fill="#4b5563"/>
  <circle cx="879" cy="508" r="8" fill="#4b5563"/>
  <text class="t" x="908" y="463" font-size="11.5" fill="#9f1239">④ 灰度采纳率</text>
  <text class="m" x="908" y="486" font-size="15" font-weight="bold" fill="#7f1d1d">5% → 10%</text>
  <text class="t" x="908" y="506" font-size="11.5" font-weight="bold" fill="#b91c1c">红灯 · 回滚</text>
  <text class="t" x="908" y="524" font-size="9.5" fill="#64748b">n=2 万灰度用户</text>
  <text class="t" x="908" y="540" font-size="9.5" fill="#64748b">阈值 ≥45% · 目标 60%</text>

  <text class="t" x="70" y="586" font-size="12" fill="#9f1239">判定：3 盏绿灯也挡不住样本错配——采纳率红灯一票否决，VOD 灰度停留在旧管道，保留回滚开关。</text>
  <text class="t" x="70" y="608" font-size="11.5" fill="#475569">放大条件：样本量与大盘偏差小于 2pp，且连续两批灰度通过；先证明样本能代表大盘，再谈放量。</text>

  <!-- ===== 知识条（单条大字） ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <use href="#elder" transform="translate(150,744) scale(0.62)"/>
  <text class="t" x="230" y="676" font-size="20" font-weight="bold" fill="#78350f">Runtime 长老划重点</text>
  <rect x="238" y="690" width="880" height="66" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text class="t" x="262" y="729" font-size="18" font-weight="bold" fill="#78350f">三盏绿灯不代表安全：口径错配的样本，会把回滚推给下一批用户。</text>
  <rect x="1000" y="652" width="140" height="30" rx="15" fill="none" stroke="#b45309" stroke-width="1.5"/>
