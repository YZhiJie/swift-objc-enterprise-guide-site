  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">Code Review 五查：正确性/可读性/测试/性能/安全，对照清单不走过场</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">模块化拆分依赖，feature 分支 + PR 审批，主干永远可发布</text>
