  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="146" r="14" fill="#F05138"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 风格混乱 + Review 走过场</text>
  <rect x="64" y="176" width="270" height="150" rx="12" fill="#1e293b" stroke="#e5484d" stroke-width="2.5"/>
  <circle cx="84" cy="194" r="5.5" fill="#ff6b6b"/>
  <circle cx="102" cy="194" r="5.5" fill="#ffd166"/>
  <circle cx="120" cy="194" r="5.5" fill="#4cd97b"/>
  <text class="m" x="84" y="222" font-size="11.5" fill="#e2e8f0">func doThing(_ x:Int)-&gt;String{</text>
  <text class="m" x="84" y="242" font-size="11.5" fill="#e2e8f0">  let r = x * 2;return "\(r)"</text>
  <text class="m" x="84" y="262" font-size="11.5" fill="#e2e8f0">}</text>
  <text class="m" x="84" y="300" font-size="11" fill="#fbbf24">PR: LGTM 👍</text>
  <text class="m" x="84" y="318" font-size="11" fill="#f87171">没人真看就合了</text>
  <polygon points="470,238 486,238 478,252" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <rect x="388" y="178" width="156" height="60" rx="12" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <text class="t" x="466" y="202" text-anchor="middle" font-size="12.5" fill="#475569">十个人十种风格，</text>
  <text class="t" x="466" y="222" text-anchor="middle" font-size="12.5" fill="#475569">review 只点 LGTM</text>
  <use href="#swifty" transform="translate(492,332) scale(0.5)"/>
  <text class="t an" x="64" y="352">没有工具约束的规范等于没规范，review 没有清单等于没 review</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="642" cy="146" r="14" fill="#007AFF"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 工具化规范 + Git Flow</text>
  <rect x="636" y="176" width="230" height="60" rx="12" fill="#eff6ff" stroke="#007AFF" stroke-width="2.5"/>
  <text class="t" x="650" y="200" font-size="13" font-weight="bold" fill="#1e293b">SwiftLint 强制风格</text>
  <text class="t" x="650" y="222" font-size="11.5" fill="#64748b">.swiftlint.yml 配置规则，CI 不过不合并</text>
  <rect x="880" y="176" width="260" height="60" rx="12" fill="#f5f3ff" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="t" x="894" y="200" font-size="13" font-weight="bold" fill="#1e293b">API 设计准则</text>
  <text class="t" x="894" y="222" font-size="11.5" fill="#64748b">命名清晰、协议前置、错误显式</text>
  <rect x="636" y="250" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="270" font-size="13" fill="#475569">Git Flow：feature 分支开发 → PR → 至少 1 人 approve → 合并 main</text>
  <rect x="636" y="286" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="306" font-size="13" fill="#475569">模块化：按业务拆 SPM/Framework，编译隔离、依赖单向</text>
  <text class="t" x="648" y="354" font-size="15" font-weight="bold" fill="#007AFF">「规范靠工具落地，review 靠清单保真」</text>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="416" r="14" fill="#f59e0b"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text class="t pt" x="92" y="422">落地收束 · Code Review 五查清单</text>
  <circle cx="76" cy="450" r="12" fill="#F05138"/>
  <text class="t" x="76" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text class="t" x="100" y="454" font-size="14" font-weight="bold" fill="#1e293b">查正确性</text>
  <text class="t an" x="100" y="474">边界条件、错误处理、并发安全</text>
  <line x1="76" y1="466" x2="76" y2="490" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="504" r="12" fill="#007AFF"/>
  <text class="t" x="76" y="509" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text class="t" x="100" y="508" font-size="14" font-weight="bold" fill="#1e293b">查可读性</text>
  <text class="t an" x="100" y="528">命名、注释、函数长度、职责单一</text>
  <line x1="76" y1="520" x2="76" y2="544" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="558" r="12" fill="#7C3AED"/>
  <text class="t" x="76" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text class="t" x="100" y="562" font-size="14" font-weight="bold" fill="#1e293b">查测试</text>
  <text class="t an" x="100" y="582">新逻辑有测试、旧测试不被绕过</text>
  <rect x="360" y="428" width="780" height="176" rx="12" fill="#1e293b" stroke="#007AFF" stroke-width="2.5"/>
  <text class="m" x="380" y="452" font-size="11" fill="#94a3b8">// .swiftlint.yml：规则当代码管，进仓库全员生效</text>
  <text class="m" x="380" y="476" font-size="12" fill="#e2e8f0">disabled_rules:</text>
  <text class="m" x="396" y="496" font-size="12" fill="#e2e8f0">- trailing_whitespace</text>
  <text class="m" x="380" y="518" font-size="12" fill="#e2e8f0">line_length:</text>
  <text class="m" x="396" y="538" font-size="12" fill="#e2e8f0">warning: 120</text>
  <text class="m" x="396" y="558" font-size="12" fill="#e2e8f0">error: 200</text>
  <text class="m" x="380" y="584" font-size="11" fill="#94a3b8">// 4.查性能 5.查安全：循环复杂度、强制解包、硬编码密钥</text>

