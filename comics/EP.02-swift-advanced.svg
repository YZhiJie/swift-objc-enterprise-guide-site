  <rect x="0" y="0" width="1200" height="840" fill="#f0f4fa"/>
  <circle cx="180" cy="64" r="60" fill="#F05138" opacity="0.05"/>
  <circle cx="1120" cy="120" r="80" fill="#007AFF" opacity="0.05"/>
  <circle cx="1100" cy="760" r="70" fill="#7C3AED" opacity="0.04"/>
  <circle cx="140" cy="780" r="50" fill="#F05138" opacity="0.04"/>

  <rect x="40" y="6" width="120" height="6" rx="3" fill="#F05138"/>
  <rect x="40" y="16" width="120" height="6" rx="3" fill="#007AFF"/>
  <text class="t st" x="40" y="40">Swift &amp; ObjC 学园 · 漫画支部</text>
  <text class="t bt" x="40" y="80">第 2 话 · Swift 高级 — 结构化并发与 Actor</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#F05138"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">EP.02</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#c8d3e8" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="146" r="14" fill="#F05138"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 数据竞争错乱</text>
  <rect x="64" y="176" width="270" height="150" rx="12" fill="#1e293b" stroke="#e5484d" stroke-width="2.5"/>
  <circle cx="84" cy="194" r="5.5" fill="#ff6b6b"/>
  <circle cx="102" cy="194" r="5.5" fill="#ffd166"/>
  <circle cx="120" cy="194" r="5.5" fill="#4cd97b"/>
  <text class="m" x="84" y="222" font-size="11.5" fill="#e2e8f0">DispatchQueue.global().async {</text>
  <text class="m" x="96" y="242" font-size="11.5" fill="#e2e8f0">self.count += 1</text>
  <text class="m" x="84" y="262" font-size="11.5" fill="#e2e8f0">}</text>
  <text class="m" x="84" y="284" font-size="11" fill="#fbbf24">Thread Sanitizer: data race</text>
  <text class="m" x="84" y="304" font-size="11" fill="#f87171">count 有时是 998 不是 1000</text>
  <polygon points="470,238 486,238 478,252" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <rect x="388" y="178" width="156" height="60" rx="12" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <text class="t" x="466" y="202" text-anchor="middle" font-size="12.5" fill="#475569">开了十个线程各加一，</text>
  <text class="t" x="466" y="222" text-anchor="middle" font-size="12.5" fill="#475569">结果总数对不上……</text>
  <use href="#swifty" transform="translate(492,332) scale(0.5)"/>
  <text class="t an" x="64" y="352">GCD 只管派发不管隔离，共享状态靠加锁很容易漏</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="642" cy="146" r="14" fill="#007AFF"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text class="t pt" x="668" y="152">机制登场 · async/await + Actor 隔离</text>
  <rect x="636" y="176" width="230" height="60" rx="12" fill="#eff6ff" stroke="#007AFF" stroke-width="2.5"/>
  <text class="t" x="650" y="200" font-size="13" font-weight="bold" fill="#1e293b">async / await 结构化并发</text>
  <text class="t" x="650" y="222" font-size="11.5" fill="#64748b">任务有层级、有取消、编译器追踪</text>
  <rect x="880" y="176" width="260" height="60" rx="12" fill="#f5f3ff" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="t" x="894" y="200" font-size="13" font-weight="bold" fill="#1e293b">Actor 串行化可变状态</text>
  <text class="t" x="894" y="222" font-size="11.5" fill="#64748b">外部访问必须 await，内部天然安全</text>
  <rect x="636" y="250" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="270" font-size="13" fill="#475569">async let 并行子任务：父任务 await 时自动等所有子任务完成</text>
  <rect x="636" y="286" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="306" font-size="13" fill="#475569">Task 树：取消父任务，子任务自动收到取消信号</text>
  <text class="t" x="648" y="354" font-size="15" font-weight="bold" fill="#007AFF">「Swift 6 严格并发：数据竞争在编译期就被拦住」</text>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="416" r="14" fill="#f59e0b"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text class="t pt" x="92" y="422">落地收束 · Actor 封装 + 并行 await</text>
  <rect x="60" y="446" width="340" height="160" rx="12" fill="#1e293b" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="m" x="76" y="470" font-size="11" fill="#94a3b8">// Actor 隔离可变状态</text>
  <text class="m" x="76" y="492" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">actor</tspan> Counter {</text>
  <text class="m" x="92" y="512" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">private</tspan> <tspan fill="#c084fc">var</tspan> count = <tspan fill="#fbbf24">0</tspan></text>
  <text class="m" x="92" y="532" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">func</tspan> increment() { count += <tspan fill="#fbbf24">1</tspan> }</text>
  <text class="m" x="76" y="552" font-size="12" fill="#e2e8f0">}</text>
  <text class="m" x="76" y="578" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">await</tspan> counter.increment()  <tspan fill="#94a3b8">// 外部必 await</tspan></text>
  <rect x="420" y="446" width="720" height="160" rx="12" fill="#1e293b" stroke="#007AFF" stroke-width="2.5"/>
  <text class="m" x="436" y="470" font-size="11" fill="#94a3b8">// 结构化并发：并行抓取再汇总</text>
  <text class="m" x="436" y="494" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">async let</tspan> users = fetchUsers()</text>
  <text class="m" x="436" y="516" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">async let</tspan> posts = fetchPosts()</text>
  <text class="m" x="436" y="538" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">let</tspan> result = <tspan fill="#c084fc">try await</tspan> (users, posts)</text>
  <text class="m" x="436" y="560" font-size="12" fill="#e2e8f0"><tspan fill="#94a3b8">// 两个请求并行，await 时一起返回</tspan></text>
  <text class="m" x="436" y="586" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">let</tspan> task = Task { <tspan fill="#c084fc">await</tspan> longWork() }</text>
  <text class="m" x="700" y="586" font-size="12" fill="#94a3b8">// task.cancel() 可取消整棵树</text>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <use href="#elder" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">Runtime 长老划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">用 Actor 封装可变状态，外部访问一律 await，编译期杜绝数据竞争</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">async let 并行子任务、Task 树自动传播取消，告别手写回调地狱</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">Swift 6 严格并发默认开启，Sendable 约束把线程安全写进类型</text>
  <rect x="1000" y="700" width="140" height="32" rx="16" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="1070" y="721" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">EP.02 · Swift 高级</text>

  <text class="t ft" x="40" y="822">银翼工坊 Silverwing Workshop · 第 2 话 — 深入阅读 02-swift-advanced.md · 动手去 ActorBank 实验场</text>
</svg>
