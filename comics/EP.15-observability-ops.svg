  <text class="t bt" x="40" y="80">第 15 话 · 线上运营闭环 — 可观测性与灰度</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#F05138"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">EP.15</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#c8d3e8" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="146" r="14" fill="#F05138"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 盲飞 + 拍脑袋</text>
  <rect x="64" y="176" width="270" height="150" rx="12" fill="#1e293b" stroke="#e5484d" stroke-width="2.5"/>
  <circle cx="84" cy="194" r="5.5" fill="#ff6b6b"/>
  <circle cx="102" cy="194" r="5.5" fill="#ffd166"/>
  <circle cx="120" cy="194" r="5.5" fill="#4cd97b"/>
  <text class="m" x="84" y="222" font-size="11.5" fill="#f87171">崩溃率升高，但不知哪崩</text>
  <text class="m" x="84" y="248" font-size="11.5" fill="#f87171">灰度 50%，不知道该不该全量</text>
  <text class="m" x="84" y="274" font-size="11.5" fill="#f87171">新功能出问题，无法秒级回滚</text>
  <text class="m" x="84" y="304" font-size="11" fill="#fbbf24">运营全靠用户反馈和感觉</text>
  <polygon points="470,238 486,238 478,252" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <rect x="388" y="178" width="156" height="60" rx="12" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <text class="t" x="466" y="202" text-anchor="middle" font-size="12.5" fill="#475569">没有数据，决策全靠</text>
  <text class="t" x="466" y="222" text-anchor="middle" font-size="12.5" fill="#475569">拍脑袋和用户骂</text>
  <use href="#swifty" transform="translate(492,332) scale(0.5)"/>
  <text class="t an" x="64" y="352">可观测性是运营的眼睛，Feature Flag 是发布的刹车</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="642" cy="146" r="14" fill="#007AFF"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 三支柱 + Flag + A/B</text>
  <rect x="636" y="176" width="160" height="60" rx="12" fill="#eff6ff" stroke="#007AFF" stroke-width="2.5"/>
  <text class="t" x="716" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">可观测性三支柱</text>
  <text class="t" x="716" y="216" text-anchor="middle" font-size="10.5" fill="#64748b">日志/指标/链路</text>
  <rect x="810" y="176" width="160" height="60" rx="12" fill="#f5f3ff" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="t" x="890" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Feature Flag</text>
  <text class="t" x="890" y="216" text-anchor="middle" font-size="10.5" fill="#64748b">开关控制 + Kill Switch</text>
  <rect x="984" y="176" width="156" height="60" rx="12" fill="#fff7ed" stroke="#F05138" stroke-width="2.5"/>
  <text class="t" x="1062" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">A/B 实验</text>
  <text class="t" x="1062" y="216" text-anchor="middle" font-size="10.5" fill="#64748b">一致性哈希分桶</text>
  <rect x="636" y="250" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="270" font-size="13" fill="#475569">MetricKit 采集崩溃/卡顿/功耗，系统回调聚合，无需自建 SDK</text>
  <rect x="636" y="286" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="306" font-size="13" fill="#475569">发布门禁：核心指标（崩溃率/成功率）超阈值自动暂停灰度</text>
  <text class="t" x="648" y="354" font-size="15" font-weight="bold" fill="#007AFF">「数据驱动决策：能观测才敢发布，有开关才能回滚」</text>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="416" r="14" fill="#f59e0b"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 埋点校验 + Flag 瀑布 + 门禁</text>
  <circle cx="76" cy="450" r="12" fill="#F05138"/>
  <text class="t" x="76" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text class="t" x="100" y="454" font-size="14" font-weight="bold" fill="#1e293b">埋点 Schema 校验</text>
  <text class="t an" x="100" y="474">PII 脱敏，字段不合规直接拦截</text>
  <line x1="76" y1="466" x2="76" y2="490" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="504" r="12" fill="#007AFF"/>
  <text class="t" x="76" y="509" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text class="t" x="100" y="508" font-size="14" font-weight="bold" fill="#1e293b">Flag 评估瀑布</text>
  <text class="t an" x="100" y="528">远程→本地缓存→默认值，秒级 Kill</text>
  <line x1="76" y1="520" x2="76" y2="544" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="558" r="12" fill="#7C3AED"/>
  <text class="t" x="76" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text class="t" x="100" y="562" font-size="14" font-weight="bold" fill="#1e293b">发布门禁决策</text>
  <text class="t an" x="100" y="582">崩溃率&gt;0.5% 暂停灰度，自动回滚</text>
  <rect x="360" y="428" width="780" height="176" rx="12" fill="#1e293b" stroke="#007AFF" stroke-width="2.5"/>
  <text class="m" x="380" y="452" font-size="11" fill="#94a3b8">// Feature Flag：远程优先，本地兜底，秒级关停</text>
  <text class="m" x="380" y="476" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">func</tspan> isEnabled(_ key: String) -&gt; Bool {</text>
  <text class="m" x="396" y="496" font-size="12" fill="#e2e8f0"><tspan color="#94a3b8">if let</tspan> remote = remoteFlags[key] { <tspan fill="#c084fc">return</tspan> remote }</text>
  <text class="m" x="396" y="516" font-size="12" fill="#e2e8f0"><tspan color="#94a3b8">if let</tspan> cache = localCache[key]   { <tspan fill="#c084fc">return</tspan> cache }</text>
  <text class="m" x="396" y="536" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">return</tspan> defaults[key] ?? <tspan fill="#fbbf24">false</tspan></text>
  <text class="m" x="380" y="556" font-size="12" fill="#e2e8f0">}</text>
  <text class="m" x="380" y="584" font-size="11" fill="#94a3b8">// 发布门禁：崩溃率、核心转化率、ANR 超阈值自动暂停全量</text>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <use href="#elder" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">Runtime 长老划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">可观测性三支柱：日志查问题、指标看趋势、链路追调用，MetricKit 免 SDK</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">Feature Flag 必须有 Kill Switch，出问题秒级关闭，不依赖发版</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">发布门禁：核心指标超阈值自动暂停灰度+回滚，不靠人盯</text>
