  <rect x="0" y="0" width="1200" height="840" fill="#f0f4fa"/>
  <circle cx="180" cy="64" r="60" fill="#F05138" opacity="0.05"/>
  <circle cx="1120" cy="120" r="80" fill="#007AFF" opacity="0.05"/>
  <circle cx="1100" cy="760" r="70" fill="#7C3AED" opacity="0.04"/>
  <circle cx="140" cy="780" r="50" fill="#F05138" opacity="0.04"/>

  <rect x="40" y="6" width="120" height="6" rx="3" fill="#F05138"/>
  <rect x="40" y="16" width="120" height="6" rx="3" fill="#007AFF"/>
  <text class="t st" x="40" y="40">Swift &amp; ObjC 学园 · 漫画支部</text>
  <text class="t bt" x="40" y="80">第 6 话 · 性能与安全 — Instruments 与 Keychain</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#F05138"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">EP.06</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#c8d3e8" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="146" r="14" fill="#F05138"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 慢 + 漏</text>
  <rect x="64" y="176" width="270" height="150" rx="12" fill="#1e293b" stroke="#e5484d" stroke-width="2.5"/>
  <circle cx="84" cy="194" r="5.5" fill="#ff6b6b"/>
  <circle cx="102" cy="194" r="5.5" fill="#ffd166"/>
  <circle cx="120" cy="194" r="5.5" fill="#4cd97b"/>
  <text class="m" x="84" y="222" font-size="11.5" fill="#fbbf24">启动耗时: 3.2s</text>
  <text class="m" x="84" y="244" font-size="11.5" fill="#f87171">主线程卡顿 480ms</text>
  <text class="m" x="84" y="284" font-size="11.5" fill="#fbbf24">UserDefaults token</text>
  <text class="m" x="84" y="304" font-size="11.5" fill="#f87171">明文存储, 可被读取</text>
  <polygon points="470,238 486,238 478,252" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <rect x="388" y="178" width="156" height="60" rx="12" fill="#ffffff" stroke="#F05138" stroke-width="2.5"/>
  <text class="t" x="466" y="202" text-anchor="middle" font-size="12.5" fill="#475569">启动慢、滑动卡，</text>
  <text class="t" x="466" y="222" text-anchor="middle" font-size="12.5" fill="#475569">token 还存明文……</text>
  <use href="#swifty" transform="translate(492,332) scale(0.5)"/>
  <text class="t an" x="64" y="352">性能靠感觉优化、机密靠 UserDefaults 存，都是线上事故的温床</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="642" cy="146" r="14" fill="#007AFF"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 测量驱动 + 系统加密</text>
  <rect x="636" y="176" width="230" height="60" rx="12" fill="#eff6ff" stroke="#007AFF" stroke-width="2.5"/>
  <text class="t" x="650" y="200" font-size="13" font-weight="bold" fill="#1e293b">Instruments 测量</text>
  <text class="t" x="650" y="222" font-size="11.5" fill="#64748b">Time Profiler / Allocations / Leaks 定位瓶颈</text>
  <rect x="880" y="176" width="260" height="60" rx="12" fill="#f5f3ff" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="t" x="894" y="200" font-size="13" font-weight="bold" fill="#1e293b">Keychain 加密存储</text>
  <text class="t" x="894" y="222" font-size="11.5" fill="#64748b">系统级加密 + 访问控制，卸载不丢失</text>
  <rect x="636" y="250" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="270" font-size="13" fill="#475569">启动优化：减少 +load、懒加载非首屏资源、二进制重排</text>
  <rect x="636" y="286" width="504" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text class="t" x="650" y="306" font-size="13" fill="#475569">ATS 强制 HTTPS、Certificate Pinning 防中间人攻击</text>
  <text class="t" x="648" y="354" font-size="15" font-weight="bold" fill="#007AFF">「先测量再优化，机密不进 UserDefaults」</text>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#ffffff" stroke="#c8d3e8" stroke-width="3"/>
  <circle cx="66" cy="416" r="14" fill="#f59e0b"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 启动三砍 + Keychain 封装</text>
  <circle cx="76" cy="450" r="12" fill="#F05138"/>
  <text class="t" x="76" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text class="t" x="100" y="454" font-size="14" font-weight="bold" fill="#1e293b">砍启动任务</text>
  <text class="t an" x="100" y="474">非首屏 SDK 延后到 didFinishLaunching 之后</text>
  <line x1="76" y1="466" x2="76" y2="490" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="504" r="12" fill="#007AFF"/>
  <text class="t" x="76" y="509" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text class="t" x="100" y="508" font-size="14" font-weight="bold" fill="#1e293b">砍内存占用</text>
  <text class="t an" x="100" y="528">图片按需解码、列表行复用、 autoreleasepool</text>
  <line x1="76" y1="520" x2="76" y2="544" stroke="#c8d3e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="558" r="12" fill="#7C3AED"/>
  <text class="t" x="76" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text class="t" x="100" y="562" font-size="14" font-weight="bold" fill="#1e293b">机密存 Keychain</text>
  <text class="t an" x="100" y="582">用 kSecClassGenericPassword 封装读写</text>
  <rect x="360" y="428" width="780" height="176" rx="12" fill="#1e293b" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="m" x="380" y="452" font-size="11" fill="#94a3b8">// 机密存 Keychain，绝不进 UserDefaults</text>
  <text class="m" x="380" y="476" font-size="12" fill="#e2e8f0"><tspan fill="#c084fc">let</tspan> query: [String: Any] = [</text>
  <text class="m" x="396" y="496" font-size="12" fill="#e2e8f0">kSecClass <tspan fill="#c084fc">as</tspan> String: kSecClassGenericPassword,</text>
  <text class="m" x="396" y="516" font-size="12" fill="#e2e8f0">kSecAttrAccount <tspan fill="#c084fc">as</tspan> String: <tspan fill="#8fd14f">"authToken"</tspan>,</text>
  <text class="m" x="396" y="536" font-size="12" fill="#e2e8f0">kSecValueData <tspan fill="#c084fc">as</tspan> String: token.data(using: .utf8)!]</text>
  <text class="m" x="380" y="558" font-size="12" fill="#e2e8f0">SecItemAdd(query <tspan fill="#c084fc">as</tspan> CFDictionary, <tspan fill="#c084fc">nil</tspan>)</text>
  <text class="m" x="380" y="584" font-size="11" fill="#94a3b8">// 配合 kSecAttrAccessibleWhenUnlocked 控制访问时机</text>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <use href="#elder" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">Runtime 长老划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">先测量再优化，Instruments 定位瓶颈，禁止凭感觉改代码</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">机密（token/密钥）只存 Keychain，UserDefaults 只存非敏感配置</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">ATS 强制 HTTPS + Certificate Pinning，防止中间人窃听流量</text>
  <rect x="1000" y="700" width="140" height="32" rx="16" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="1070" y="721" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">EP.06 · 性能安全</text>

  <text class="t ft" x="40" y="822">银翼工坊 Silverwing Workshop · 第 6 话 — 深入阅读 06-performance-security.md · 动手去 EnterprisePatterns 实验场</text>
</svg>
